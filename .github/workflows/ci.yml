name: CI

# Builds and tests both halves of the portal on every push and pull request,
# so a change that does not compile — or that breaks the authorization rules —
# is caught before it reaches a deployment.

on:
  push:
    branches: [ main, master ]
  pull_request:

# Least-privilege default: none of these jobs need to write to the repo,
# open issues, or touch other permissions GITHUB_TOKEN can carry.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The test suite runs against in-memory H2, so no database service is
      # needed here. See square-backend/src/test/resources/application-test.yaml
      - name: Build and test
        working-directory: square-backend
        run: ./mvnw --batch-mode verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: square-backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: square-frontend/package-lock.json

      - name: Install dependencies
        working-directory: square-frontend
        run: npm ci

      - name: Lint
        working-directory: square-frontend
        run: npm run lint

      # Surfaces high/critical advisories in the log without failing the build:
      # xlsx (used for the import/export feature) currently has a high-severity
      # advisory with no fix published on npm, which would otherwise redden
      # every run. Treat this as something to review, not a hard gate.
      - name: Audit dependencies
        working-directory: square-frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Production build
        working-directory: square-frontend
        run: npm run build

      # Nothing sign-in-able may ship in a public bundle.
      - name: Check no credentials in the bundle
        working-directory: square-frontend
        run: |
          if grep -rqE 'sk-ant-[A-Za-z0-9]|VITE_DEMO_PASSWORD=.+' dist/; then
            echo "::error::A credential appears to be present in the production bundle"
            exit 1
          fi
          echo "No credentials in the bundle."

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Confirms the Render deployment image still builds — catches a broken
      # Dockerfile or a build-stage dependency issue before it reaches Render.
      - name: Build backend image
        run: docker build -t square-backend:ci square-backend

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches a password or key committed by accident. Passwords belong in
      # environment variables or the gitignored square-backend/config/, never
      # in a tracked file.
      - name: Scan tracked files for hardcoded credentials
        run: |
          set +e
          PATTERN='(password|passwd|pwd)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"'$][^"'"'"']*["'"'"']|PGPASSWORD[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"'$]|sk-ant-[A-Za-z0-9]{10}|AKIA[0-9A-Z]{16}'
          HITS=$(git grep -InE "$PATTERN" -- . ':!*.md' ':!.github/workflows/*' \
                 | grep -viE 'setPassword|getPassword|\.password\(|newPassword|currentPassword|tempPassword|PasswordEncoder|"password"|password: \$\{|password: ""')
          if [ -n "$HITS" ]; then
            echo "::error::Possible hardcoded credential in a tracked file"
            echo "$HITS"
            exit 1
          fi
          echo "No hardcoded credentials found in tracked files."
