# Test configuration — no PostgreSQL server required, so `mvn test` runs on any
# machine and in CI.
#
# Flyway is switched off here on purpose: the migrations are written in
# PostgreSQL syntax and are verified against a real PostgreSQL database, not
# against H2. Tests get their schema from the entities instead.
spring:
  datasource:
    url: jdbc:h2:mem:squaretest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

square:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    root: WARN
